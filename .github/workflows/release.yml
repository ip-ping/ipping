name: Release

# Cut a release in either of two ways; both take the same path:
#   git tag v0.1.0 && git push origin v0.1.0
#   gh workflow run release.yml -f version=0.1.0 -f dry_run=false      (or the Actions tab)
# A dry run builds and checks everything and publishes nothing. See RELEASING.md in the ipping
# repository for the order and rules.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (0.1.0, or 0.2.0-rc.1 for a preview)"
        required: true
        type: string
      dry_run:
        description: "Build and check everything, publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            tag="$GITHUB_REF_NAME"; publish=true
          else
            tag="v${INPUT_VERSION#v}"
            if [ "$INPUT_DRY_RUN" = true ]; then publish=false; else publish=true; fi
            if [ "$publish" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are cut from main; this run is on $GITHUB_REF."; exit 1
            fi
          fi
          version="${tag#v}"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::'$tag' is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1; }
          file="$(jq -r .version package.json)"
          [ "${version%%-*}" = "$file" ] \
            || { echo "::error::$tag does not match the version in package.json ($file). Bump it (and package-lock.json) and merge first."; exit 1; }
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"; echo "version=$version"; echo "minor=${version%.*}"
            echo "prerelease=$prerelease"; echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease: $prerelease, publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Checks
    needs: prepare
    uses: ./.github/workflows/ci.yml

  image:
    name: Versioned image
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          # `latest` is owned by docker.yml (it tracks main); a release adds 1.2.3 and, for stable
          # releases, 1.2.
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/ipping:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.prerelease == 'false' && format('{0}/ipping:{1}', vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME, needs.prepare.outputs.minor) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: [prepare, ci, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the frontend bundle for direct installs
        run: |
          set -eu
          BACKEND_URL=http://127.0.0.1:8000 npm run build
          mkdir -p dist
          sh scripts/make-bundle.sh "dist/ipping-frontend-${TAG}.tar.gz"
      - name: Fetch the pinned backend release
        run: |
          set -eu
          # release.env names the backend release this frontend was tested with.
          . ./release.env
          {
            echo "BACKEND_TAG=$BACKEND_TAG"
            echo "BACKEND_SCHEMA_REVISION=$BACKEND_SCHEMA_REVISION"
            echo "NODE_MIN_VERSION=$NODE_MIN_VERSION"
          } >> "$GITHUB_ENV"
          gh release download "$BACKEND_TAG" -R ip-ping/ipping-backend -p SHA256SUMS -p requirements.lock -D backend-assets \
            || { echo "::error::The backend release $BACKEND_TAG does not exist. Release the backend first (see RELEASING.md)."; exit 1; }
      - name: Write release-manifest.json
        run: |
          set -eu
          sum() { awk -v f="$1" '$2 == f || $2 == "*" f { print $1 }' backend-assets/SHA256SUMS; }
          wheel="$(awk '{ print $2 }' backend-assets/SHA256SUMS | grep '\.whl$' | head -n 1)"
          [ -n "$wheel" ] || { echo "::error::no wheel in the backend release"; exit 1; }
          bundle="dist/ipping-frontend-${TAG}.tar.gz"
          backend_url="https://github.com/ip-ping/ipping-backend/releases/download/${BACKEND_TAG}"
          STACK_VERSION="$VERSION" \
          FRONTEND_VERSION="$VERSION" \
          FRONTEND_IMAGE="${NAMESPACE}/ipping:${VERSION}" \
          FRONTEND_BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$bundle")" \
          FRONTEND_BUNDLE_SHA256="$(sha256sum "$bundle" | awk '{ print $1 }')" \
          BACKEND_VERSION="${BACKEND_TAG#v}" \
          BACKEND_IMAGE="${NAMESPACE}/ipping-backend:${BACKEND_TAG#v}" \
          BACKEND_WHEEL_URL="${backend_url}/${wheel}" \
          BACKEND_WHEEL_SHA256="$(sum "$wheel")" \
          BACKEND_LOCK_URL="${backend_url}/requirements.lock" \
          BACKEND_LOCK_SHA256="$(sum requirements.lock)" \
          BACKEND_SCHEMA_REVISION="$BACKEND_SCHEMA_REVISION" \
          NODE_MIN_VERSION="$NODE_MIN_VERSION" \
          sh scripts/release-manifest.sh > dist/release-manifest.json
          jq . dist/release-manifest.json
      - name: Assemble the release files
        run: |
          set -eu
          cp ipping.sh compose.yaml dist/
          cp deploy/Caddyfile dist/Caddyfile
          (cd dist && sha256sum -- ipping.sh compose.yaml Caddyfile release-manifest.json ipping-frontend-*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            args=(--generate-notes --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); else args+=(--latest); fi
            gh release create "$TAG" dist/* "${args[@]}"
          fi
